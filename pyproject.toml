[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdm-intelligence"
version = "3.0.0"
description = "Industrial AI Predictive Maintenance System"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [{name = "Murat SUER", email = "murat@muratsuer.eu"}]
keywords = ["predictive-maintenance", "industrial-ai", "time-series"]

dependencies = [
    "sqlalchemy>=2.0.47",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "tenacity>=8.2.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "websockets>=12.0", "pyyaml>=6.0"]
ml = ["scikit-learn>=1.4.0", "xgboost>=2.0.0", "shap>=0.45.0", "polars>=0.20.0", "optuna>=3.5.0", "joblib>=1.3.0", "redis>=5.0.0"]
test = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "pytest-cov>=4.1.0", "pytest-mock>=3.12.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
